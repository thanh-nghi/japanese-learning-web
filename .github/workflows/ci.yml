name: Check JavaScript

on: [push, pull_request]

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest

    steps:
      - name: Lay source code
        uses: actions/checkout@v6

      - name: Chuan bi Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Cai dat thu vien
        run: npm ci

      - name: Kiem tra cu phap
        run: |
          node --check script.js
          node --check validators.js
          node --check storage.js
          node --check api.js

      - name: Lint
        run: npx eslint validators.js tests/validators.test.mjs

      - name: Chay test logic
        run: |
          node --test tests/validators.test.mjs