name: Check JavaScript

on: [push, pull_request]

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest

    steps:
      - name: Lay source code
        uses: actions/checkout@v6

      - name: Chuan bi Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Cai dat thu vien
        run: npm ci

      - name: Kiem tra cu phap
        run: |
          node --check script.js
          node --check validators.js
          node --check storage.js
          node --check api.js

      - name: Lint
        run: npx eslint script.js validators.js storage.js api.js tests/validators.test.mjs

      - name: Chay test logic
        run: |
          node --test tests/validators.test.mjs

      - name: Chuan bi thu muc website
        run: |
          mkdir -p _site
          cp index.html style.css script.js api.js storage.js validators.js _site/

      - name: Dong goi va upload
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site  

  deploy_demo:
    needs: syntax
    runs-on: ubuntu-latest
    if: ${{github.event_name == 'push' && github.ref == 'refs/heads/main'}}
    steps:
      - name: Mo phong deploy
        run: echo "CI passed - deploy demo"